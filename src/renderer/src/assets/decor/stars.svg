<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Whimsical four-pointed sparkles and twinkling stars -->
  <g opacity="0.85">
    <!-- Star 1: Large sparkle top-center -->
    <path d="M48 10 C48 24, 38 32, 22 34 C38 36, 48 44, 48 58 C48 44, 58 36, 74 34 C58 32, 48 24, 48 10 Z" fill="#FCEBD6" stroke="#F1C28F" stroke-width="1.2" stroke-linejoin="round" />
    <circle cx="48" cy="34" r="2" fill="#F4A968" opacity="0.6" />

    <!-- Star 2: Medium sparkle bottom-right -->
    <path d="M76 60 C76 68, 70 74, 60 75 C70 76, 76 82, 76 90 C76 82, 82 76, 92 75 C82 74, 76 68, 76 60 Z" fill="#E8E4F5" stroke="#C4B8E2" stroke-width="1" stroke-linejoin="round" />

    <!-- Star 3: Small twinkle bottom-left -->
    <path d="M22 66 C22 71, 18 75, 12 76 C18 77, 22 81, 22 86 C22 81, 26 77, 32 76 C26 75, 22 71, 22 66 Z" fill="#FFF2DC" stroke="#ECC38D" stroke-width="0.8" />

    <!-- Sparkle dots / stardust -->
    <circle cx="68" cy="18" r="1.5" fill="#F6BE8B" opacity="0.7" />
    <circle cx="28" cy="48" r="1.8" fill="#D3C7EC" opacity="0.8" />
    <circle cx="88" cy="44" r="1.3" fill="#F6C392" opacity="0.6" />
    <circle cx="40" cy="80" r="1.4" fill="#E0D7F0" opacity="0.7" />
  </g>
</svg>
