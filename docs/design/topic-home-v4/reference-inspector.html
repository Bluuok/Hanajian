<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花笺 · R0分区检查</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#fbf9f7;color:#344657;font:14px/1.6 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{margin:0 0 12px}button,select{font:inherit;padding:6px 10px;border:1px solid #d9e1e8;border-radius:8px;background:white;color:inherit}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.stage{position:relative;max-width:1182px;margin:auto;background:white}.stage img{display:block;width:100%;height:auto}.zone{position:absolute;border:2px solid #b54c73;pointer-events:none}.zone span{position:absolute;top:0;left:0;background:#344657;color:white;font:11px/1.6 system-ui;padding:1px 5px;white-space:nowrap}.stage[data-overlay="off"] .zone{display:none}.zone.hidden{display:none}.detail{width:min(100%,822px);height:330px;overflow:hidden;position:relative;border:1px solid #d9e1e8;background:white;margin-top:16px}.detail img{position:absolute;max-width:none}.error{color:#a53045}a{color:#91455f}
</style></head><body><h1>R0：只看一个区域，再组合验收</h1><p>读取仓库已有参考图。边框是约定分区，不是逐像素测绘；图像用于人工对照，不能作为生产页面背景。先核对它与本轮用户图一是否一致。</p><nav><label>区域 <select id="part"></select></label><button id="toggle">隐藏边框</button><a href="layout.html">HTML/CSS几何合同</a><a href="../../../design.md">根设计合同</a></nav><p id="notice"></p><div class="stage" data-overlay="on"><img id="reference" src="../../verification/homepage-reference.png" alt="仓库已有插画设计参考"></div><h2>选中区域局部</h2><div class="detail"><img id="detail" src="../../verification/homepage-reference.png" alt="选中的参考区域局部"></div><script>
// All boxes are normalized to the 1182x745 user reference composition.
const zones=[['all','整页',0,0,1182,745],['nav','导航',0,0,152,745],['groups','群组',157,14,181,710],['hero','标题',348,16,530,96],['filter','筛选',348,118,530,94],['summary','摘要',348,227,530,145],['art','人物',885,0,297,374],['evidence','证据',348,378,485,232],['source','来源',837,378,335,232],['related','底部卡片',348,615,824,103]];
const stage=document.querySelector('.stage'),select=document.querySelector('#part'),detail=document.querySelector('.detail');
for(const [id,label,x,y,w,h] of zones){select.add(new Option(label,id));if(id==='all')continue;const z=document.createElement('div');z.className='zone';z.dataset.id=id;Object.assign(z.style,{left:x/1182*100+'%',top:y/745*100+'%',width:w/1182*100+'%',height:h/745*100+'%'});const s=document.createElement('span');s.textContent=label;z.append(s);stage.append(z)}
function refresh(){const z=zones.find(z=>z[0]===select.value);stage.querySelectorAll('.zone').forEach(el=>el.classList.toggle('hidden',select.value!=='all'&&el.dataset.id!==select.value));const scale=Math.min(detail.clientWidth/z[4],330/z[5]);const image=document.querySelector('#detail');Object.assign(image.style,{width:1182*scale+'px',height:745*scale+'px',left:-z[2]*scale+'px',top:-z[3]*scale+'px'});document.querySelector('#notice').textContent='当前：'+z[1]+'；图一原画、构图单独评审，不与未生成状态混比。'}
select.onchange=refresh;document.querySelector('#toggle').onclick=()=>{const off=stage.dataset.overlay==='on';stage.dataset.overlay=off?'off':'on';document.querySelector('#toggle').textContent=off?'显示边框':'隐藏边框'};window.addEventListener('resize',refresh);document.querySelector('#reference').onerror=()=>{const n=document.querySelector('#notice');n.className='error';n.textContent='未加载到仓库参考图。请保留目录结构运行，或核对 docs/verification/homepage-reference.png。'};refresh();
</script></body></html>
