name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<package version> tag to publish'
        type: string
        required: true
      confirm_publish:
        description: 'Publish the installer to Bluuok/Hanajian Releases'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build and publish Windows installer
    if: github.repository == 'Bluuok/Hanajian' && inputs.confirm_publish == true
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/wechat-connector/go.mod
          cache-dependency-path: services/wechat-connector/go.sum

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match package version $packageVersion. Expected $expectedTag."
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:win

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'dist/hanajian-*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer was not generated.'
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanajian-${{ inputs.release_tag }}-windows-x64
          path: |
            dist/hanajian-*-setup.exe
            dist/hanajian-*-setup.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $assets = @(
            (Get-ChildItem -Path 'dist/hanajian-*-setup.exe').FullName
            (Get-ChildItem -Path 'dist/hanajian-*-setup.exe.blockmap').FullName
            (Resolve-Path -LiteralPath 'dist/latest.yml').Path
            (Resolve-Path -LiteralPath 'dist/SHA256SUMS.txt').Path
          )
          gh release create $env:RELEASE_TAG $assets `
            --verify-tag `
            --title "hanajian $env:RELEASE_TAG" `
            --generate-notes
